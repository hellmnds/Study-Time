function duration(){return s.timer.elapsed+(s.timer.start?Math.max(0,Date.now()-s.timer.start):0)}function setExamDate(v){let c=s.contests.find(x=>x.id===s.activeContest)||s.contests[0];if(c){c.exam=v;save();tick()}}function examTick(){let e=$('examCountdown');if(!e)return;let c=s.contests.find(x=>x.id===s.activeContest)||s.contests[0];if(!c?.exam){e.textContent='Defina a data da prova';return}let n=Math.floor((new Date(c.exam+'T00:00:00-03:00').getTime()-Date.now())/1000);if(n<=0){e.textContent='Data da prova chegou ♡';return}e.textContent=`${Math.floor(n/86400)}d ${String(Math.floor(n/3600)%24).padStart(2,'0')}h ${String(Math.floor(n/60)%60).padStart(2,'0')}m ${String(n%60).padStart(2,'0')}s`}function tick(){examTick();let e=$('clock');if(e){let n=Math.floor(duration()/1000);e.textContent=[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')}}setInterval(tick,500);function toggleTimer(){if(s.timer.start){s.timer.elapsed=duration();s.timer.start=0}else s.timer.start=Date.now();save();render()}function resetTimer(){if(confirm('Zerar cronômetro sem registrar?')){s.timer={start:0,elapsed:0,title:''};save();render()}}function logTimer(){let m=Math.round(duration()/60000),title=s.timer.title.trim();if(!title||m<1)return alert('Informe a disciplina e estude pelo menos um minuto.');let key=s.timer.planKey,notes=s.timer.content||'',questions=s.timer.questions||0,correct=s.timer.correct||0;if(key)s.done[key]=true;let externalQuestions=s.timer.external?.length||0,externalCorrect=(s.timer.external||[]).filter(Boolean).length;let {topic,contest,kind}=s.timer;let t=s.topics.find(x=>x.id===topic&&x.contest===contest);if(t)t.last=date();s.timer={start:0,elapsed:0,title:''};add('sessions',{title,min:m,date:date(),kind:kind||'Cronômetro',topic,contest,notes,questions,correct,externalQuestions,externalCorrect,planKey:key||''})}

function csvRows(text){let delim=text.split(/\r?\n/)[0].includes(';')?';':',',rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(!quote&&c===delim){row.push(cell);cell=''}else if(!quote&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
async function importQuestions(){try{let f=$('qfile').files[0],t=s.topics[+val('qtopic')];if(!t)return alert('Cadastre um tópico primeiro.');if(f&&/\.pdf$/i.test(f.name)){let id=crypto.randomUUID();await fileOp('readwrite',o=>o.put(f,id));s.bank.push({file:id,name:f.name});qi=s.bank.length-1;save();render();return}let raw=(f?await f.text():val('qtext')).trim().replace(/^\uFEFF/,'');let arr;if(raw.startsWith('['))arr=JSON.parse(raw);else{let rows=csvRows(raw),headers=rows.shift().map(x=>x.trim().toLowerCase());arr=rows.filter(r=>r.some(Boolean)).map(r=>{let o=Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']));return {pergunta:o.pergunta||o.enunciado,explicacao:o.explicacao,banca:o.banca,ano:o.ano,alternativas:['a','b','c','d','e'].map(k=>o[k]).filter(Boolean),gabarito:o.gabarito}})}if(!Array.isArray(arr)||!arr.length)throw Error('Nenhuma questão encontrada');let clean=arr.map(x=>{let g=String(x.gabarito||'').trim().toUpperCase();if(!x.pergunta||!Array.isArray(x.alternativas)||x.alternativas.length<2||x.alternativas.length>5||!g.match(/^[A-E]$/)||g.charCodeAt(0)-65>=x.alternativas.length)throw Error('Questão ou gabarito inválido');return {id:crypto.randomUUID(),pergunta:String(x.pergunta),explicacao:String(x.explicacao||''),banca:String(x.banca||''),ano:String(x.ano||''),alternativas:x.alternativas.map(String),gabarito:g,topic:t.id,contest:t.contest}});qi=s.bank.length;s.bank.push(...clean);chosen='';feedback=null;save();render()}catch(e){alert('Importação: '+e.message)}}function chooseQ(i){if(feedback!==null)return;chosen=String.fromCharCode(65+i);render()}function moveQ(d){qi=Math.max(0,Math.min(s.bank.length-1,qi+d));chosen='';feedback=null;render()}function gradeQ(){let q=s.bank[qi];if(!chosen||!q||feedback!==null)return;feedback=chosen===q.gabarito;let t=s.topics.find(t=>t.id===q.topic&&t.contest===q.contest);if(t){t.q=Number(t.q||0)+1;t.a=Number(t.a||0)+Number(feedback);t.last=date()}s.attempts.push({id:q.id,correct:feedback,date:date(),answer:chosen});if(s.ti const dbp=new Promise((res,rej)=>{let r=indexedDB.open('StudyTimeFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});async function fileOp(mode,fn){let db=await dbp;return new Promise((res,rej)=>{let tx=db.transaction('files',mode),r=fn(tx.objectStore('files'));tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error)})}async function newRecord(k){let title=val('title');if(!title)return alert('Informe um título.');let f=$('file').files[0],id='';try{if(f){id=crypto.randomUUID();await fileOp('readwrite',o=>o.put(f,id))}add(k,{title,author:val('author'),url:val('url'),body:val('body'),file:id,date:date(),status:'Desejado'})}catch(e){alert('Não foi possível armazenar o arquivo.')}}async function openFile(id){let f=await fileOp('readonly',o=>o.get(id));if(!f)return alert('Arquivo não encontrado.');let u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),600000)}async function removeRecord(k,i){if(!confirm('Excluir registro e arquivo?'))return;let id=s[k][i].file;if(id)await fileOp('readwrite',o=>o.delete(id));s[k].splice(i,1);save();render()}function saveVersion(i){let t=s.essays[i];(t.versions??=[]).push({date:new Date().toLocaleString('pt-BR'),body:t.body});save();render()}async function backup(){try{let files={};for(let t of [...s.books,...s.essays,...s.materials,...s.tests,...s.contests,...s.bank])if(t.file){let f=await fileOp('readonly',o=>o.get(t.file));if(f)files[t.file]=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}let u=URL.createObjectURL(new Blob([JSON.stringify({state:s,files})],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='Study-Time-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert('Falha no backup: '+e.message)}}async function restore(f){if(!f)return;try{let b=JSON.parse(await f.text());if(!b.state||!Array.isArray(b.state.topics)||!Array.isArray(b.state.plan))throw Error('Formato inválido');if(!confirm('Substituir os registros atuais pelo backup?'))return;for(let [id,u] of Object.entries(b.files||{})){if(!u.startsWith('data:'))throw Error('Arquivo inválido');let blob=await (await fetch(u)).blob();await fileOp('readwrite',o=>o.put(blob,id))}s={...fresh(),...b.state};initExtra();save();render()}catch(e){alert('Não foi possível restaurar: '+e.message)}}

const kittyDefs=[['minutes','Horas líquidas por dia',240,'👑','Coroa do foco'],['questions','Questões por dia',80,'🎀','Laço rosa'],['accuracy','Acertos (%)',80,'🐟','Peixinho dourado'],['flash','Flashcards por dia',30,'🧶','Novelo mágico'],['law','Artigos por dia',40,'⚖️','Gatinho jurista'],['review','Revisões por semana',7,'🌷','Tulipas'],['tests','Simulados por semana',1,'🏆','Troféu'],['essays','Redações por semana',1,'🧸','Ursinho']];
function kittyInit(){s.kitty??={};let k=s.kitty;k.name??='Study Kitty';k.goals??={};k.events??=[];k.prizes??={};for(let [id,label,v] of kittyDefs)k.goals[id]??={value:v,on:true};return k}
function kittyEvent(type){kittyInit().events.push({type,date:date()});save()}
const kittyFlash=rateFlash;rateFlash=function(ok){let c=flashList()[flashIndex];if(c&&flashFlip)kittyEvent('flash');kittyFlash(ok)};
const kittyLaw=lawRead7;lawRead7=function(){if(s.laws[lawIndex]?.articles[articleIndex])kittyEvent('law');kittyLaw()};
function kittyStats(){let k=kittyInit(),d=date(),m=new Date();m.setDate(m.getDate()-(m.getDay()+6)%7);let w=date(m),ss=s.sessions.filter(x=>x.date===d),aa=s.attempts.filter(x=>x.date===d),q=aa.length+ss.reduce((a,x)=>a+Number(x.externalQuestions||0),0)+(s.timer.external?.length||0),c=aa.filter(x=>x.correct).length+ss.reduce((a,x)=>a+Number(x.externalCorrect||0),0)+(s.timer.external||[]).filter(Boolean).length;return {minutes:ss.reduce((a,x)=>a+Number(x.min||0),0)+duration()/60000,questions:q,accuracy:q?100*c/q:0,flash:k.events.filter(x=>x.date===d&&x.type==='flash').length,law:k.events.filter(x=>x.date===d&&x.type==='law').length,review:s.sessions.filter(x=>x.date>=w&&x.date<=d&&x.kind==='Revisão').length,tests:s.tests.filter(x=>x.date>=w&&x.date<=d).length,essays:s.essays.filter(x=>x.date>=w&&x.date<=d).length}}
function kittyUnlock(){let k=kittyInit(),v=kittyStats(),changed=false;for(let [id,label,n,e,name] of kittyDefs){let g=k.goals[id];if(g.on&&v[id]>=g.value&&!k.prizes[id]&&(id!=='accuracy'||v.questions>=10)){k.prizes[id]=date();changed=true;kittyToast(e+' '+name+' desbloqueado!')}}if(changed)save()}
function kittyToast(msg){let e=document.createElement('div');e.className='kittyToast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),4500)}
function kittyCat(){return `<svg viewBox="0 0 240 245" width="190" role="img" aria-label="Gatinho de progresso"><defs><clipPath id="kittyClip"><path d="M64 93 L53 29 Q52 19 63 25 L101 53 Q120 47 139 53 L177 25 Q188 19 187 32 L177 94 Q195 115 181 142 Q169 160 149 164 Q176 181 169 207 Q163 226 120 226 Q77 226 71 207 Q64 181 91 164 Q54 156 54 125 Q52 108 64 93Z"/></clipPath></defs><path d="M157 205 Q215 220 210 174 Q207 158 194 168" stroke="#c58ba9" stroke-width="15" stroke-linecap="round" fill="none"/><g clip-path="url(#kittyClip)"><rect width="240" height="245" fill="white"/><rect id="kittyFill" x="0" y="226" width="240" height="0" fill="#ecaacd"/></g><path d="M64 93 L53 29 Q52 19 63 25 L101 53 Q120 47 139 53 L177 25 Q188 19 187 32 L177 94 Q195 115 181 142 Q169 160 149 164 Q176 181 169 207 Q163 226 120 226 Q77 226 71 207 Q64 181 91 164 Q54 156 54 125 Q52 108 64 93Z" stroke="#a86a8a" stroke-width="3" fill="none"/><path d="M64 42 L70 72 L88 58Z M176 42 L170 72 L152 58Z" fill="#f3b8d2"/><ellipse cx="91" cy="112" rx="5" ry="8" fill="#704b61"/><ellipse cx="149" cy="112" rx="5" ry="8" fill="#704b61"/><ellipse cx="77" cy="129" rx="12" ry="6" fill="#f29ebb"/><ellipse cx="163" cy="129" rx="12" ry="6" fill="#f29ebb"/><path d="M114 123 Q120 119 126 123 L120 129Z" fill="#a86a8a"/><path d="M120 129 Q112 141 105 132 M120 129 Q128 141 135 132" stroke="#704b61" stroke-width="2.5" fill="none"/><text x="120" y="200" text-anchor="middle" fill="#fff" font-size="32">♥</text><text id="kittyCrown" x="120" y="43" text-anchor="middle" font-size="35"></text></svg>`}
function kittyPanel(){let k=kittyInit();return `<div class="card kittyPanel"><h3>🐾 ${esc(k.name)} ♡</h3>${kittyCat()}<b id="kittyTime"></b><div id="kittyBars"></div>${btn('Meu quartinho',"go('Study Kitty')")}</div>`}
function kittySettings(){let k=kittyInit();return `<div class="card"><h3>🐾 Metas do Study Kitty</h3><label>Nome do gatinho <input value="${esc(k.name)}" onchange="kittyInit().name=this.value;save()"></label>${kittyDefs.map(([id,label])=>`<div class="kittyGoal"><label><input type="checkbox" ${k.goals[id].on?'checked':''} onchange="kittyInit().goals['${id}'].on=this.checked;save()"> ${label}</label><input type="number" min="${id==='minutes'?0.25:1}" ${id==='accuracy'?'max="100"':''} step="${id==='minutes'?0.25:1}" value="${k.goals[id].value/(id==='minutes'?60:1)}" onchange="kittySet('${id}',this)"></div>`).join('')}<small>Acertos: mínimo de 10 questões. Metas semanais reiniciam na segunda. Prêmios não expiram.</small></div>`}
function kittySet(id,e){let n=Number(e.value);if(!Number.isFinite(n)||n<=0||(id==='accuracy'&&n>100)){e.value=kittyInit().goals[id].value/(id==='minutes'?60:1);return}kittyInit().goals[id].value=n*(id==='minutes'?60:1);save();kittyUnlock()}
function kittyRoom(){let k=kittyInit();return head('Study Kitty','Seu cantinho de conquistas ♡')+kittyPanel()+`<div class="card kittyRoom"><h3>Meu quartinho</h3><div class="kittyShelf">${kittyDefs.filter(([id])=>k.prizes[id]).map(x=>`<span title="${x[4]}">${x[3]}</span>`).join('')||'♡ Seu primeiro prêmio está esperando'}</div><div style="font-size:48px">🪴 🛋️ 🐈 📚</div></div><div class="grid">${kittyDefs.map(([id,l,n,e,name])=>`<div class="card" style="opacity:${k.prizes[id]?1:.55}"><span style="font-size:32px">${e}</span><h3>${name}</h3><small>${k.prizes[id]?'Conquistado em '+k.prizes[id]:'🔒 '+l}</small></div>`).join('')}</div>`}
function kittyRefresh(){let k=kittyInit(),v=kittyStats(),g=k.goals.minutes,p=g.on?Math.min(1,v.minutes/g.value):0,f=$('kittyFill');if(f){f.setAttribute('y',226-207*p);f.setAttribute('height',207*p);$('kittyCrown').textContent=p>=1?'👑':'';$('kittyTime').textContent=Math.floor(v.minutes/60)+'h '+Math.floor(v.minutes%60)+'min'+(g.on?' / '+g.value/60+'h':'');$('kittyBars').innerHTML=kittyDefs.filter(([id])=>k.goals[id].on).map(([id,l])=>{let a=v[id],b=k.goals[id].value;return `<div class="kittyBar"><small>${l}: ${id==='minutes'?(a/60).toFixed(1):Math.floor(a)} / ${id==='minutes'?b/60:b}</small><progress max="${b}" value="${Math.min(a,b)}"></progress></div>`}).join('')} }
pages.push('Study Kitty');const kittyRender=render;render=function(){kittyRender();kittyUnlock();if(page==='Início')$('main').insertAdjacentHTML('afterbegin',kittyPanel());if(page==='Configurações')$('main').insertAdjacentHTML('afterbegin',kittySettings());if(page==='Study Kitty')$('main').innerHTML=kittyRoom();kittyRefresh()};setInterval(()=>{kittyUnlock();kittyRefresh()},1000);render();
let langView='notebooks',langOpen=null;
function langData(){return s.langNotebooks??=[]}
function langNew(parent=null){let title=prompt(parent?'Nome da página':'Nome do caderno');if(!title?.trim())return;let id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);langData().push({id,parent,lang:s.activeLanguage,title:title.trim(),body:''});langOpen=id;save();render()}
function langDelete(id){if(!confirm('Excluir esta página e todas as subpáginas?'))return;let ids=new Set([id]);let changed=true;while(changed){changed=false;for(let n of langData())if(ids.has(n.parent)&&!ids.has(n.id)){ids.add(n.id);changed=true}}s.langNotebooks=langData().filter(n=>!ids.has(n.id));langOpen=null;save();render()}
function langTree(parent=null,depth=0){return langData().filter(n=>n.lang===s.activeLanguage&&n.parent===parent).map(n=>`<div style="margin-left:${Math.min(depth,8)*12}px"><button style="width:100%;text-align:left;margin:3px 0;${langOpen===n.id?'background:#f3c9df':''}" onclick="langOpen='${n.id}';render()">${depth?'📄':'📒'} ${esc(n.title)}</button></div>${langTree(n.id,depth+1)}`).join('')}
function langInsert(prefix,suffix=''){let e=$('langBody');if(!e)return;let a=e.selectionStart,b=e.selectionEnd;e.setRangeText(prefix+e.value.slice(a,b)+suffix,a,b,'end');e.dispatchEvent(new Event('input'));e.focus()}
function langPanel(){let n=langData().find(x=>x.id===langOpen&&x.lang===s.activeLanguage);return `<div class="card"><div class="line"><button onclick="langView='notebooks';render()">📒 Cadernos</button><button onclick="langView='legacy';render()">🌷 Vocabulário original</button></div></div>`+(langView==='legacy'?'':`<div class="card line"><select onchange="s.activeLanguage=this.value;langOpen=null;save();render()">${s.languages.map(l=>`<option ${l===s.activeLanguage?'selected':''}>${esc(l)}</option>`).join('')}</select><button onclick="let l=prompt('Novo idioma');if(l?.trim()){l=l.trim();if(!s.languages.includes(l))s.languages.push(l);s.activeLanguage=l;langOpen=null;save();render()}">＋ Idioma</button></div><div class="langLayout"><div class="card"><h3>Meus cadernos</h3><button onclick="langNew()">＋ Caderno</button>${langTree()||'<p>Crie seu primeiro caderno ♡</p>'}</div><div class="card">${n?`<input style="font-size:22px;font-weight:bold;width:100%" value="${esc(n.title)}" onchange="langData().find(x=>x.id==='${n.id}').title=this.value.trim()||'Sem título';save();render()"><div class="line"><button onclick="langNew('${n.id}')">＋ Subpágina</button><button onclick="langDelete('${n.id}')">Excluir</button></div><div class="line"><button onclick="langInsert('\\n## ')">Título</button><button onclick="langInsert('**','**')">Negrito</button><button onclick="langInsert('\\n- ')">Lista</button><button onclick="langInsert('\\n- [ ] ')">Checklist</button><button onclick="langInsert('\\n| Regra | Exemplo |\\n| --- | --- |\\n|  |  |\\n')">Tabela</button></div><textarea id="langBody" style="width:100%;min-height:340px" placeholder="Regras, exemplos, traduções e anotações..." oninput="langData().find(x=>x.id==='${n.id}').body=this.value;save()">${esc(n.body)}</textarea><small>Salvamento automático • editor de texto com marcações Markdown</small>`:'<h3>Seu cantinho de idiomas ♡</h3><p>Selecione um caderno ou crie uma página de gramática, vocabulário ou prática.</p>'}</div></div>`)}
const langRender=render;render=function(){langRender();if(page==='Línguas'){let panel=langPanel();if(langView==='legacy')$('main').insertAdjacentHTML('afterbegin',panel);else $('main').innerHTML=head('Línguas','Cadernos e páginas de estudo ♡')+panel}};render();

const kittyLong=[['days','Patinhas constantes',7,'🐾','dias consecutivos'],['theory','Mestre dos livros',3000,'📚','minutos de teoria'],['flash','Memória de elefante',500,'🧠','flashcards'],['questions','Rainha das questões',1000,'💎','questões'],['law','Domadora de leis',100,'⚖️','artigos registrados'],['essays','Escritora',10,'💌','redações'],['tests','Campeã dos simulados',10,'🏆','simulados'],['minutes','Castelo dos estudos',6000,'🏰','minutos'],['half','Borboleta da evolução',50,'🦋','% do edital'],['full','Rumo à posse',100,'🎓','% do edital']];
function kittyTotals82(){let k=kittyInit(),ss=s.sessions,ds=new Set(ss.filter(x=>Number(x.min)>0).map(x=>x.date)),d=new Date(),streak=0;if(!ds.has(date(d)))d.setDate(d.getDate()-1);while(ds.has(date(d))){streak++;d.setDate(d.getDate()-1)}let ts=s.topics.filter(t=>t.contest===s.activeContest),pct=ts.length?100*ts.filter(t=>t.status==='Dominado').length/ts.length:0;return {days:streak,theory:ss.filter(x=>x.kind==='Teoria').reduce((a,x)=>a+Number(x.min||0),0),minutes:ss.reduce((a,x)=>a+Number(x.min||0),0),questions:s.attempts.length+ss.reduce((a,x)=>a+Number(x.externalQuestions||0),0),flash:k.events.filter(x=>x.type==='flash').length,law:k.events.filter(x=>x.type==='law').length,essays:s.essays.length,tests:s.tests.length,half:pct,full:pct,improve:0}}
const unlock82=kittyUnlock;kittyUnlock=function(){unlock82();let k=kittyInit(),v=kittyTotals82();k.long??={};let changed=false;for(let [id,n,target,e] of kittyLong){if(v[id]>=target&&!k.long[id]){k.long[id]=date();changed=true;kittyToast(e+' '+n+' conquistado!')}}if(changed)save()};
