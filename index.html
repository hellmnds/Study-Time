let started=0,elapsed=0;function timerHTML(){return `<div class="card"><h3>Cronômetro de estudo</h3><div id="clock" class="timer">00:00:00</div>${field('session','Disciplina')}${btn('Iniciar / pausar','toggleTimer()')}${btn('Registrar sessão','logTimer()')}<div class="line">${field('manual','Minutos','number')}${btn('Registrar manualmente','logManual()')}</div></div>`}function tick(){let e=$('clock');if(e)e.textContent=new Date(elapsed+(started?Date.now()-started:0)).toISOString().slice(11,19)}setInterval(tick,500);function toggleTimer(){if(started){elapsed+=Date.now()-started;started=0}else started=Date.now();tick()}function logTimer(){let m=Math.round((elapsed+(started?Date.now()-started:0))/60000);if(!val('session')||m<1)return alert('Informe a disciplina e estude pelo menos um minuto.');started=elapsed=0;add('sessions',{title:val('session'),min:m,date:date()})}function logManual(){let m=+val('manual');if(m>0&&val('session'))add('sessions',{title:val('session'),min:m,date:date()})}
const dbp=new Promise((res,rej)=>{let r=indexedDB.open('StudyTimeFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});async function fileOp(mode,fn){let db=await dbp;return new Promise((res,rej)=>{let tx=db.transaction('files',mode),r=fn(tx.objectStore('files'));tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error)})}async function newRecord(k){let title=val('title');if(!title)return alert('Informe um título.');let f=$('file').files[0],id='';try{if(f){id=crypto.randomUUID();await fileOp('readwrite',o=>o.put(f,id))}add(k,{title,author:val('author'),url:val('url'),body:val('body'),file:id,date:date(),status:'Desejado'})}catch(e){alert('Não foi possível armazenar o arquivo.')}}async function openFile(id){let f=await fileOp('readonly',o=>o.get(id));if(!f)return alert('Arquivo não encontrado.');let u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),600000)}async function removeRecord(k,i){if(!confirm('Excluir registro e arquivo?'))return;let id=s[k][i].file;if(id)await fileOp('readwrite',o=>o.delete(id));s[k].splice(i,1);save();render()}function saveVersion(i){let t=s.essays[i];(t.versions??=[]).push({date:new Date().toLocaleString('pt-BR'),body:t.body});save();render()}async function backup(){try{let files={};for(let t of [...s.books,...s.essays,...s.materials,...s.contests])if(t.file){let f=await fileOp('readonly',o=>o.get(t.file));if(f)files[t.file]=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}let u=URL.createObjectURL(new Blob([JSON.stringify({state:s,files})],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='Study-Time-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert('Falha no backup: '+e.message)}}async function restore(f){if(!f)return;try{let b=JSON.parse(await f.text());if(!b.state||!Array.isArray(b.stat
