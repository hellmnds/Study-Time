<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Studio ♡</title><style> *{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#63465a;font:16px system-ui}header{padding:24px;background:#f5dce9;display:flex;justify-content:space-between;flex-wrap:wrap}h1,h2,h3{margin:0 0 14px}button,input,select,textarea{font:inherit;border:1px solid #e3c4d6;border-radius:10px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#f8dce9}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #eedce7;border-radius:16px;padding:18px;overflow:hidden}.preview{height:130px;background:#f8e8f1;padding:15px;overflow:hidden;white-space:pre-wrap;border-radius:10px;margin-bottom:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.editor{min-height:300px;background:white;border:1px solid #e3c4d6;border-radius:12px;padding:20px;outline:none}.editor img{max-width:100%}textarea{width:100%;min-height:100px}small{color:#86677b}a{color:#a34e81} .pill{background:#f5dce9;padding:8px;border-radius:20px}progress{width:100%;accent-color:#d68eb6} </style><header><h1>🐱 Language Studio ♡</h1><a href="https://hellmnds.github.io/Study-Time/">Study Time ↗</a></header><nav id="nav"></nav><main id="main"></main><script>
const key='languageStudio.v1';let s;try{s=JSON.parse(localStorage.getItem(key))}catch{};s=s||{langs:[{id:'fr',name:'🇫🇷 Francês'},{id:'en',name:'🇬🇧 Inglês'}],pages:[],words:[],logs:[],goals:{minutes:20,words:5},rewards:[]};let lang=s.langs[0].id,tab='Cadernos',parent=null,editing=null,started=null;const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()+'',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(key,JSON.stringify(s)),today=()=>new Date().toLocaleDateString('en-CA');function plain(h){let d=document.createElement('div');d.innerHTML=h;return d.textContent}function go(t){tab=t;parent=null;editing=null;render()}function addLang(){let n=prompt('Nome do idioma');if(n){lang=uid();s.langs.push({id:lang,name:n});save();go('Cadernos')}}function newPage(){let n=prompt('Título da página');if(n){let p={id:uid(),lang,parent,title:n,body:'',emoji:'📒',color:'#f8e8f1'};s.pages.push(p);save();openPage(p.id)}}function openPage(id){editing=id;render()}function folder(id){parent=id;editing=null;render()}function updatePage(){let p=s.pages.find(x=>x.id===editing);if(!p)return;p.title=$('pt').value;p.emoji=$('pe').value;p.color=$('pc').value;p.body=$('ed').innerHTML;save()}function fmt(c,v=null){$('ed').focus();document.execCommand(c,false,v);updatePage()}function speak(t){if(!('speechSynthesis'in window))return alert('Áudio indisponível');let u=new SpeechSynthesisUtterance(t);u.lang=({fr:'fr-FR',en:'en-US'})[lang]||'en-US';speechSynthesis.speak(u)}function addWord(){let w=$('word').value.trim(),t=$('translation').value.trim();if(!w||!t)return;s.words.push({id:uid(),lang,w,t,date:today()});save();render()}function log(){let n=Number($('mins').value);if(n>0){s.logs.push({lang,n,date:today()});save();render()}}function timer(){if(!started){started=Date.now();render()}else{let n=Math.max(1,Math.round((Date.now()-started)/60000));s.logs.push({lang,n,date:today()});started=null;save();render()}}function render(){let l=s.langs.find(x=>x.id===lang)||s.langs[0];$('nav').innerHTML=`<select onchange="lang=this.value;go('Cadernos')">${s.langs.map(x=>`<option value="${esc(x.id)}" ${x.id===lang?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button onclick="addLang()">＋ Idioma</button>${['Cadernos','Vocabulário','Conversação','Passaporte','Configurações'].map(t=>`<button onclick="go('${t}')" ${tab===t?'style="background:#f3d2e4"':''}>${t}</button>`).join('')}`;let m=$('main');let minutes=s.logs.filter(x=>x.date===today()&&x.lang===lang).reduce((a,b)=>a+b.n,0),words=s.words.filter(x=>x.date===today()&&x.lang===lang).length;for(let [ok,r] of [[minutes>=s.goals.minutes,'🎀 Laço do foco'],[words>=s.goals.words,'🧳 Mala de palavras']])if(ok&&!s.rewards.includes(r)){s.rewards.push(r);save()}let top=`<div class="bar"><span class="pill">${esc(l.name)}</span><button onclick="timer()">${started?'⏹ Encerrar sessão':'▶ Iniciar estudo'}</button></div>`;if(tab==='Cadernos'){if(editing){let p=s.pages.find(x=>x.id===editing);m.innerHTML=top+`<button onclick="folder('${p.parent||''}');if(!parent)parent=null;render()">← Galeria</button><div class="bar"><input id="pe" value="${esc(p.emoji)}" size="3" oninput="updatePage()"><input id="pt" value="${esc(p.title)}" oninput="updatePage()"><input id="pc" type="color" value="${esc(p.color)}" oninput="updatePage()"><button onclick="folder('${p.id}')">Subpáginas</button></div><div class="bar"><button onclick="fmt('bold')"><b>B</b></button><button onclick="fmt('italic')"><i>I</i></button><button onclick="fmt('formatBlock','h2')">Título</button><button onclick="fmt('insertUnorderedList')">Lista</button><button onclick="fmt('insertOrderedList')">1. Lista</button><button onclick="fmt('insertHTML','<table border=1><tr><td>Exemplo</td><td>Tradução</td></tr><tr><td>...</td><td>...</td></tr></table>')">Tabela</button><button onclick="fmt('hiliteColor','#f8dce9')">Destaque</button></div><div id="ed" class="editor" contenteditable="true" oninput="updatePage()"></div><small>Salvamento automático neste navegador.</small>`;$('ed').innerHTML=p.body;return}let p=s.pages.find(x=>x.id===parent);m.innerHTML=top+`<h2>${p?esc(p.title):'📚 Meus cadernos'}</h2>${p?`<button onclick="folder('${p.parent||''}');if(!parent)parent=null;render()">← Voltar</button>`:''}<div class="grid">${s.pages.filter(x=>x.lang===lang&&(x.parent||null)===(parent||null)).map(x=>`<div class="card"><div class="preview" style="background:${esc(x.color)}" onclick="openPage('${x.id}')">${esc(plain(x.body).slice(0,220)||x.emoji)}</div><button onclick="openPage('${x.id}')">${esc(x.emoji+' '+x.title)}</button></div>`).join('')}<button class="card" onclick="newPage()">＋ Nova página</button></div>`}else if(tab==='Vocabulário'){m.innerHTML=top+`<h2>🌷 Dicionário pessoal</h2><div class="bar"><input id="word" placeholder="Palavra"><input id="translation" placeholder="Tradução"><button onclick="addWord()">Salvar</button></div><div class="grid">${s.words.filter(x=>x.lang===lang).map(x=>`<div class="card"><b>${esc(x.w)}</b><p><details><summary>Revelar tradução</summary>${esc(x.t)}</details></p><button data-word="${esc(x.w)}" onclick="speak(this.dataset.word)">🔊 Ouvir</button></div>`).join('')}</div>`}else if(tab==='Conversação'){m.innerHTML=top+`<div class="card"><h2>💬 Kitty Conversation</h2><p>Pratique com uma IA em outra aba. A integração direta ainda não está configurada.</p><select id="level">${['A1','A2','B1','B2','C1','C2'].map(x=>`<option>${x}</option>`).join('')}</select><input id="scene" placeholder="Tema: café, viagem..."><button onclick="copyPrompt()">Copiar instrução da aula</button><p><a href="https://chatgpt.com/" target="_blank" rel="noopener">Abrir ChatGPT ↗</a></p><textarea id="practice" placeholder="Escreva uma frase para ouvir"></textarea><button onclick="speak($('practice').value)">🔊 Ouvir frase</button></div>`}else if(tab==='Passaporte'){m.innerHTML=top+`<h2>🐱 Passaporte poliglota</h2><div class="card"><h3>🐾 ${minutes}/${s.goals.minutes} minutos hoje</h3><progress value="${minutes}" max="${s.goals.minutes}"></progress><h3>${words}/${s.goals.words} palavras hoje</h3><progress value="${words}" max="${s.goals.words}"></progress><p>Registrar estudo manualmente:</p><input id="mins" type="number" min="1" placeholder="Minutos"><button onclick="log()">Registrar</button></div><h3>Conquistas permanentes</h3><div class="grid">${s.rewards.map(x=>`<div class="card">${esc(x)}</div>`).join('')||'Seu primeiro carimbo espera por você!'}</div>`}else{m.innerHTML=top+`<h2>⚙️ Configurações</h2><div class="card"><label>Minutos diários <input id="gm" type="number" min="1" value="${s.goals.minutes}"></label><p><label>Palavras diárias <input id="gw" type="number" min="1" value="${s.goals.words}"></label></p><button onclick="s.goals={minutes:Math.max(1,Number($('gm').value)||20),words:Math.max(1,Number($('gw').value)||5)};save();render()">Salvar metas</button><button onclick="backup()">Exportar backup</button></div>`}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='language-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copyPrompt(){let p=`Seja minha professora de ${s.langs.find(x=>x.id===lang).name}, nível ${$('level').value}. Converse comigo sobre ${$('scene').value||'cotidiano'}, corrija meus erros em português e faça uma pergunta por vez.`;try{await navigator.clipboard.writeText(p);alert('Instrução copiada!')}catch{prompt('Copie a instrução:',p)}}render();</script></html>
