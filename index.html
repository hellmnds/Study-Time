function duration(){return s.timer.elapsed+(s.timer.start?Math.max(0,Date.now()-s.timer.start):0)}function setExamDate(v){let c=s.contests.find(x=>x.id===s.activeContest)||s.contests[0];if(c){c.exam=v;save();tick()}}function examTick(){let e=$('examCountdown');if(!e)return;let c=s.contests.find(x=>x.id===s.activeContest)||s.contests[0];if(!c?.exam){e.textContent='Defina a data da prova';return}let n=Math.floor((new Date(c.exam+'T00:00:00-03:00').getTime()-Date.now())/1000);if(n<=0){e.textContent='Data da prova chegou ♡';return}e.textContent=`${Math.floor(n/86400)}d ${String(Math.floor(n/3600)%24).padStart(2,'0')}h ${String(Math.floor(n/60)%60).padStart(2,'0')}m ${String(n%60).padStart(2,'0')}s`}function tick(){examTick();let e=$('clock');if(e){let n=Math.floor(duration()/1000);e.textContent=[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')}}setInterval(tick,500);function toggleTimer(){if(s.timer.start){s.timer.elapsed=duration();s.timer.start=0}else s.timer.start=Date.now();save();render()}function resetTimer(){if(confirm('Zerar cronômetro sem registrar?')){s.timer={start:0,elapsed:0,title:''};save();render()}}function logTimer(){let m=Math.round(duration()/60000),title=s.timer.title.trim();if(!title||m<1)return alert('Informe a disciplina e estude pelo menos um minuto.');let key=s.timer.planKey,notes=s.timer.content||'',questions=s.timer.questions||0,correct=s.timer.correct||0;if(key)s.done[key]=true;let externalQuestions=s.timer.external?.length||0,externalCorrect=(s.timer.external||[]).filter(Boolean).length;let {topic,contest,kind}=s.timer;let t=s.topics.find(x=>x.id===topic&&x.contest===contest);if(t)t.last=date();s.timer={start:0,elapsed:0,title:''};add('sessions',{title,min:m,date:date(),kind:kind||'Cronômetro',topic,contest,notes,questions,correct,externalQuestions,externalCorrect,planKey:key||''})}

async function importQuestions(){try{let f=$('qfile').files[0],t=s.topics[+val('qtopic')];if(!t)return alert('Cadastre um tópico primeiro.');if(f&&/\.pdf$/i.test(f.name)){let id=crypto.randomUUID();await fileOp('readwrite',o=>o.put(f,id));s.bank.push({file:id,name:f.name});qi=s.bank.length-1;save();render();return}let raw=(f?await f.text():val('qtext')).trim().replace(/^\uFEFF/,'');let arr;if(raw.startsWith('['))arr=JSON.parse(raw);else{let rows=csvRows(raw),headers=rows.shift().map(x=>x.trim().toLowerCase());arr=rows.filter(r=>r.some(Boolean)).map(r=>{let o=Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']));return {pergunta:o.pergunta||o.enunciado,explicacao:o.explicacao,banca:o.banca,ano:o.ano,alternativas:['a','b','c','d','e'].map(k=>o[k]).filter(Boolean),gabarito:o.gabarito}})}if(!Array.isArray(arr)||!arr.length)throw Error('Nenhuma questão encontrada');let clean=arr.map(x=>{let g=String(x.gabarito||'').trim().toUpperCase();if(!x.pergunta||!Array.isArray(x.alternativas)||x.alternativas.length<2||x.alternativas.length>5||!g.match(/^[A-E]$/)||g.charCodeAt(0)-65>=x.alternativas.length)throw Error('Questão ou gabarito inválido');return {id:crypto.randomUUID(),pergunta:String(x.pergunta),explicacao:String(x.explicacao||''),banca:String(x.banca||''),ano:String(x.ano||''),alternativas:x.alternativas.map(String),gabarito:g,topic:t.id,contest:t.contest}});qi=s.bank.length;s.bank.push(...clean);chosen='';feedback=null;save();render()}catch(e){alert('Importação: '+e.message)}}function chooseQ(i){if(feedback!==null)return;chosen=String.fromCharCode(65+i);render()}function moveQ(d){qi=Math.max(0,Math.min(s.bank.length-1,qi+d));chosen='';feedback=null;render()}function gradeQ(){let q=s.bank[qi];if(!chosen||!q||feedback!==null)return;feedback=chosen===q.gabarito;let t=s.topics.find(t=>t.id===q.topic&&t.contest===q.contest);if(t){t.q=Number(t.q||0)+1;t.a=Number(t.a||0)+Number(feedback);t.last=date()}s.attempts.push({id:q.id,correct:feedback,date:date(),answer:chosen});if(s.ti const dbp=new Promise((res,rej)=>{let r=indexedDB.open('StudyTimeFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});async function fileOp(mode,fn){let db=await dbp;return new Promise((res,rej)=>{let tx=db.transaction('files',mode),r=fn(tx.objectStore('files'));tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error)})}async function newRecord(k){let title=val('title');if(!title)return alert('Informe um título.');let f=$('file').files[0],id='';try{if(f){id=crypto.randomUUID();await fileOp('readwrite',o=>o.put(f,id))}add(k,{title,author:val('author'),url:val('url'),body:val('body'),file:id,date:date(),status:'Desejado'})}catch(e){alert('Não foi possível armazenar o arquivo.')}}async function openFile(id){let f=await fileOp('readonly',o=>o.get(id));if(!f)return alert('Arquivo não encontrado.');let u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),600000)}async function removeRecord(k,i){if(!confirm('Excluir registro e arquivo?'))return;let id=s[k][i].file;if(id)await fileOp('readwrite',o=>o.delete(id));s[k].splice(i,1);save();render()}function saveVersion(i){let t=s.essays[i];(t.versions??=[]).push({date:new Date().toLocaleString('pt-BR'),body:t.body});save();render()}async function backup(){try{let files={};for(let t of [...s.books,...s.essays,...s.materials,...s.tests,...s.contests,...s.bank])if(t.file){let f=await fileOp('readonly',o=>o.get(t.file));if(f)files[t.file]=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}let u=URL.createObjectURL(new Blob([JSON.stringify({state:s,files})],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='Study-Time-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert('Falha no backup: '+e.message)}}async function restore(f){if(!f)return;try{let b=JSON.parse(await f.text());if(!b.state||
